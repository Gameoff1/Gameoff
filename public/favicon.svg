  <rect x="135" y="310" width="25" height="110" rx="12" fill="white" fill-opacity="0.4" />
  <rect x="192" y="310" width="25" height="110" rx="12" fill="white" fill-opacity="0.4" />
  <rect x="250" y="310" width="25" height="110" rx="12" fill="white" fill-opacity="0.4" />
  <rect x="307" y="310" width="25" height="110" rx="12" fill="white" fill-opacity="0.4" />
  <rect x="365" y="310" width="25" height="110" rx="12" fill="white" fill-opacity="0.4" />
